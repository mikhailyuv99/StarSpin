[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # SUPABASE_URL and publishable key are public (needed in browser bundle)
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY"

# Cron: daily review count sync (configure in Netlify UI with CRON_SECRET header)
# Schedule: 0 2 * * *  ->  GET /api/cron/review-counts
